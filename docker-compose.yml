# Local run of the whole product:  docker compose up --build  →  http://localhost:8080
services:
  backend:
    build: ./backend
    environment:
      APP_LOG_LEVEL: INFO
    ports:
      - "8000:8000" # API docs at http://localhost:8000/docs
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
