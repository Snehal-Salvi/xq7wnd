[project]
name = "wind-position-api"
version = "1.0.0"
description = "Day-ahead wind forecast visibility and accuracy API (Elexon BMRS)"
requires-python = ">=3.12"
# Kept identical to requirements.txt (used by Docker); tests/test_packaging.py enforces it.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real Elexon API (run with RUN_LIVE=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
